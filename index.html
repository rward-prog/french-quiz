<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unité 2 : révision de français</title>
<meta name="description" content="Practice quiz for French Unité 2: school subjects, telling time, avoir expressions, and -ER verbs.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#f7f9ff; --card:#ffffff; --ink:#1c2a6b; --ink-soft:#4a5690; --line:rgba(110,140,225,.30); --line2:rgba(110,140,225,.16);
  --margin:#e0546b; --blue:#3550d6; --hl:#ffe45c; --ok:#17794f; --ok-bg:#e3f6ec; --bad:#b8302c; --bad-bg:#fdeaea; --border:#c9d4f3;
  --hand:"Bradley Hand","Segoe Print","Chalkboard SE","Marker Felt","Comic Sans MS",cursive;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#121935; --card:#1a2347; --ink:#e9edff; --ink-soft:#a9b4ea; --line:rgba(130,160,255,.20); --line2:rgba(130,160,255,.10);
    --margin:#ff7a92; --blue:#8fa5ff; --hl:#5b4f00; --ok:#6fe0a8; --ok-bg:#12382a; --bad:#ff9a96; --bad-bg:#40191a; --border:#33417a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.55 var(--ui);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to right,var(--line2) 1px,transparent 1px);
  background-size:100% 32px,32px 100%;min-height:100vh}
body::before{content:"";position:fixed;top:0;bottom:0;left:max(14px,calc(50% - 400px));width:2px;background:var(--margin);opacity:.45;pointer-events:none}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}
header.top{max-width:760px;margin:0 auto;padding:18px 20px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:700 26px/1 var(--hand);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand span.dog{font-size:30px}
nav.main{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.main button{font:600 15px var(--ui);background:transparent;border:0;color:var(--ink-soft);padding:8px 10px;border-radius:8px;cursor:pointer}
nav.main button:hover{background:var(--card);color:var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--hand);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(40px,8vw,64px);margin-top:10px}
h1 .hlt{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 .08em}
h2{font-size:30px}h3{font-size:22px}
p{margin:0 0 .8em}
.lede{font-size:19px;color:var(--ink-soft);max-width:34em}
.bubble{display:flex;gap:12px;align-items:flex-start;margin:18px 0 26px}
.bubble .dog{font-size:44px;line-height:1}
.bubble .say{background:var(--card);border:2px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 14px;font:600 18px/1.35 var(--hand)}
.card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:18px 20px;margin:0 0 18px}
.card h2{margin-bottom:.2em}
.muted{color:var(--ink-soft);font-size:15px}
.topics{display:grid;gap:8px;margin:12px 0}
.topic{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:var(--paper)}
.topic:hover{border-color:var(--blue)}
.topic input{margin-top:5px;width:20px;height:20px;accent-color:var(--blue)}
.topic b{display:block;font-size:17px}
.topic small{color:var(--ink-soft)}
.topic .last{margin-left:auto;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 16px var(--ui);padding:11px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select{font:600 16px var(--ui);padding:9px 10px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit}
.tile:hover{border-color:var(--blue)}
.tile b{font:700 22px var(--hand);display:block}
.tile span{color:var(--ink-soft);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--hl);color:#2b2500;margin-bottom:6px}
@media (prefers-color-scheme:dark){.tag{color:#fff0a8}}
/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;font-weight:600;color:var(--ink-soft);font-size:15px;margin:8px 0 6px}
.bar{height:10px;background:var(--line2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--blue)}
.qcard{margin-top:16px}
.prompt{font-size:21px;line-height:1.45;margin:4px 0 16px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);margin:0 .15em;transform:translateY(-.1em)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--paper);border:2px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--ink);font:600 18px/1.35 var(--ui);cursor:pointer}
.choice:hover:not([disabled]){border-color:var(--blue)}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font:700 15px var(--ui)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice[disabled]{cursor:default}
.choice .mark{margin-left:auto;font-size:14px;font-weight:700;white-space:nowrap}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--paper)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.fb .quip{font:700 20px var(--hand);margin-bottom:4px}
.fb details{margin-top:8px}
.fb summary{cursor:pointer;font-weight:700;color:var(--blue)}
.fb ul{margin:8px 0 0;padding-left:20px}
.hint{margin-top:12px;padding:10px 12px;background:var(--hl);color:#2b2500;border-radius:10px;font-weight:600}
@media (prefers-color-scheme:dark){.hint{color:#fff0a8}}
.listenbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.shown{font:700 20px var(--hand);margin:0 0 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.actions .grow{margin-left:auto}
/* results + notes */
.score{font:700 72px/1 var(--hand);margin:0}
table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:16px}
th,td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink-soft);font-size:14px}
.tblwrap{overflow-x:auto}
.pct{display:inline-block;min-width:3.2em;font-weight:700}
.mini{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
.mini i{display:block;height:100%;background:var(--ok)}
.mini.weak i{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tabs button{font:700 15px var(--ui);border:2px solid var(--border);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
details.sec{border:2px solid var(--border);border-radius:12px;padding:8px 14px;margin:0 0 10px;background:var(--card)}
details.sec summary{cursor:pointer;font-weight:700}
ul.tips{padding-left:20px}ul.tips li{margin:0 0 8px}
textarea{width:100%;min-height:150px;font:17px/1.5 var(--ui);padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--paper);color:var(--ink)}
ol.sample li{margin:0 0 4px}
.chk label{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue)}
footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--ink-soft);font-size:14px}
@media (max-width:560px){body::before{display:none}.prompt{font-size:19px}.score{font-size:56px}nav.main{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* practice quiz + flashcards */
.choice.sel{border-color:var(--blue);background:var(--card);box-shadow:inset 0 0 0 2px var(--blue)}
.sechead{font:700 22px var(--hand);margin:0}
.warn{background:var(--hl);color:#2b2500;border-radius:10px;padding:10px 12px;font-weight:600;margin:0 0 14px}
@media (prefers-color-scheme:dark){.warn{color:#fff0a8}}
.tracker{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tracker button{width:36px;height:36px;border-radius:8px;border:2px solid var(--border);background:var(--paper);color:var(--ink);font:700 13px var(--ui);cursor:pointer}
.tracker button.done{background:var(--blue);color:var(--card);border-color:var(--blue)}
.tracker button[aria-current="true"]{outline:3px solid var(--ink);outline-offset:1px}
.radios{display:grid;gap:8px;margin:10px 0 14px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:var(--paper)}
.radios input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue)}
.seg{display:inline-flex;border:2px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{font:700 15px var(--ui);padding:8px 14px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.deck{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--border)}
.deck:first-of-type{border-top:0}
.deck b{font-size:18px}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;min-height:240px;padding:24px;background-color:var(--card);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line2) 31px 32px);border:2px solid var(--border);border-top:6px solid var(--margin);border-radius:14px;
  font:700 34px/1.25 var(--hand);color:var(--ink);cursor:pointer}
.fcard.back{border-top-color:var(--blue)}
.fcard small{display:block;font:600 16px var(--ui);color:var(--ink-soft);margin-top:10px}
.fcard .side{font:600 14px var(--ui);color:var(--ink-soft);margin-bottom:10px}
.pile{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;color:var(--ink-soft);font-size:15px;margin:6px 0 10px}
.btn.know{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.btn.learn{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.btn.big{padding:14px 22px;font-size:17px;flex:1;min-width:150px}
.actions + .muted{margin-top:12px}

</style>
</head>
<body>
<header class="top">
  <button class="brand" data-go="home" style="background:none;border:0;cursor:pointer;padding:0"><span class="dog" aria-hidden="true">🐶</span><span>Révision Unité 2</span></button>
  <nav class="main" aria-label="Main">
    <button data-go="home">Home</button>
    <button data-go="flash">Flashcards</button>
    <button data-go="notes">Notes</button>
    <button data-go="tips">Test tips</button>
    <button data-go="writing">Écriture</button>
  </nav>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer>Fr. 7 review practice. Your answers stay on your device.</footer>
<noscript><p style="padding:20px">This practice site needs JavaScript. Please turn it on and reload.</p></noscript>
<script>
/* Unité 2 question bank + generators. No DOM here, so it can be tested in Node. */
(function (root) {
'use strict';

/* ---------- helpers ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function slug(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
const clean = s => s.replace(/\s*\((f|m)\.\)/g, '');
const speakable = s => s.replace(/\([^)]*\)/g, '').replace(/[…]/g, '').replace(/\s+/g, ' ').trim();
const pad = n => (n < 10 ? '0' : '') + n;

const TOPICS = [
  { id: 'cours',  name: 'Les cours et les opposés', blurb: 'School subjects, odd-one-out, opposites', main: true },
  { id: 'vocab',  name: 'Vocabulaire',              blurb: 'French to English and English to French', main: true },
  { id: 'avoir',  name: 'Expressions avec avoir',   blurb: 'Pick the expression, then conjugate avoir', main: true },
  { id: 'heure',  name: 'L’heure',                  blurb: 'Telling time, including the 24-hour clock', main: true },
  { id: 'er',     name: 'Les verbes en -ER',        blurb: 'Conjugate with the right subject', main: true },
  { id: 'choix',  name: 'Quel verbe?',              blurb: 'Choose between two verbs, then conjugate', main: true },
  { id: 'listen', name: 'Écoute (optional)',        blurb: 'Listening practice with a read-aloud button', main: false },
  { id: 'challenge', name: 'Challenge: questions et négation', blurb: 'This goes beyond the test, but it’s good to know!', main: false }
];

function Q(o) { return Object.assign({ fixed: true, hint: '' }, o); }
function mkChoices(correct, correctWhy, wrongs) {
  return [{ t: correct, ok: true, why: correctWhy }].concat(wrongs.map(w => ({ t: w.t, ok: false, why: w.why })));
}

/* ---------- VOCABULARY ---------- */
// [French, English, category, options]  g = meaning group (never used as a distractor for each other), ef:false = skip English->French
const V = [
  ['la chimie', 'chemistry', 'cours'], ['l’informatique (f.)', 'computer science', 'cours'],
  ['les langues (étrangères) (f.)', '(foreign) languages', 'cours'], ['la physique', 'physics', 'cours'],
  ['la biologie', 'biology', 'cours'], ['la géographie', 'geography', 'cours'], ['l’histoire (f.)', 'history', 'cours'],
  ['les mathématiques (f.)', 'math', 'cours'], ['l’art (m.)', 'art', 'cours'], ['l’éducation physique (f.)', 'physical education', 'cours'],
  ['la cantine', 'cafeteria', 'cours'], ['un cours', 'class, course', 'cours'], ['un devoir; les devoirs', 'homework', 'cours'],
  ['l’école (f.)', 'school', 'cours'], ['une note', 'grade', 'cours'],
  ['difficile', 'difficult', 'adj'], ['facile', 'easy', 'adj'], ['inutile', 'useless', 'adj'], ['utile', 'useful', 'adj'],
  ['J’aime bien…', 'I like…', 'opinion', { g: 'like' }], ['Je n’aime pas tellement…', 'I don’t like… very much', 'opinion', { g: 'like' }],
  ['aimer', 'to like; to love', 'verbe', { g: 'like' }], ['aimer mieux', 'to prefer', 'verbe'], ['chercher', 'to look for', 'verbe', { g: 'look' }],
  ['commencer', 'to begin, to start', 'verbe'], ['dessiner', 'to draw; to design', 'verbe'], ['donner', 'to give', 'verbe'],
  ['étudier', 'to study', 'verbe', { g: 'study' }], ['habiter (à)', 'to live (in)', 'verbe'], ['manger', 'to eat', 'verbe'], ['oublier', 'to forget', 'verbe'],
  ['parler (au téléphone)', 'to speak (on the phone)', 'verbe'], ['partager', 'to share', 'verbe'],
  ['penser (que/qu’)', 'to think (that)', 'verbe', { g: 'ft' }], ['regarder', 'to look (at), to watch', 'verbe', { g: 'look' }],
  ['rencontrer', 'to meet', 'verbe', { g: 'ft' }], ['retrouver', 'to meet up with; to find (again)', 'verbe', { g: 'ft' }],
  ['travailler', 'to work', 'verbe'], ['voyager', 'to travel', 'verbe'],
  ['assister à', 'to attend', 'verbe'], ['demander', 'to ask', 'verbe'], ['échouer', 'to fail', 'verbe'], ['écouter', 'to listen (to)', 'verbe'],
  ['enseigner', 'to teach', 'verbe'], ['expliquer', 'to explain', 'verbe'], ['passer un examen', 'to take an exam', 'verbe'],
  ['préparer', 'to prepare (for)', 'verbe'], ['rentrer (à la maison)', 'to return (home)', 'verbe'],
  ['trouver', 'to find; to think', 'verbe', { g: 'ft' }], ['visiter', 'to visit (a place)', 'verbe'],
  ['apprendre', 'to learn', 'verbe', { g: 'study' }], ['réussir', 'to succeed', 'verbe'],
  ['bien sûr', 'of course', 'opinion', { g: 'ofcourse' }], ['d’accord', 'OK, all right', 'opinion'], ['Est-ce que/qu’…?', 'question phrase', 'opinion', { ef: false }],
  ['(mais) non', 'no (but of course not)', 'opinion', { g: 'ofcourse' }], ['moi/toi non plus', 'me/you neither', 'opinion'], ['ne… pas', 'no, not', 'opinion', { g: 'no' }],
  ['n’est-ce pas?', 'isn’t that right?', 'opinion'], ['oui/si', 'yes', 'opinion', { ef: false }], ['parce que', 'because', 'opinion'],
  ['pas du tout', 'not at all', 'opinion', { g: 'no' }], ['peut-être', 'maybe, perhaps', 'opinion'], ['Pourquoi?', 'Why?', 'opinion'],
  ['un an', 'a year', 'temps', { g: 'year', ef: false }], ['une/cette année', 'one/this year', 'temps', { g: 'year', ef: false }],
  ['après', 'after', 'temps'], ['un/cet après-midi', 'an/this afternoon', 'temps', { g: 'afternoon', ef: false }],
  ['un jour', 'a day', 'temps', { g: 'day', ef: false }], ['une journée', 'a day', 'temps', { g: 'day', ef: false }],
  ['un/ce matin', 'a/this morning', 'temps', { g: 'morning', ef: false }], ['la matinée', 'morning', 'temps', { g: 'morning', ef: false }],
  ['un mois/ce mois-ci', 'a month/this month', 'temps'], ['une/cette nuit', 'a/this night', 'temps'], ['une/cette semaine', 'a/this week', 'temps'],
  ['un/ce soir', 'an/this evening', 'temps', { g: 'evening', ef: false }], ['une soirée', 'an evening', 'temps', { g: 'evening', ef: false }],
  ['dernier/dernière', 'last', 'temps'], ['premier/première', 'first', 'temps'], ['prochain(e)', 'next', 'temps'], ['tous les jours', 'every day', 'temps'],
  ['Quelle heure est-il?', 'What time is it?', 'heure'], ['et quart', 'fifteen minutes past the hour', 'heure'],
  ['et demie', 'thirty minutes past the hour', 'heure'], ['moins dix', 'ten minutes before the hour', 'heure'],
  ['moins le quart', 'fifteen minutes before the hour', 'heure'], ['À quelle heure?', '(At) what time/when?', 'heure'],
  ['de l’après-midi', 'in the afternoon', 'heure', { g: 'afternoon', ef: false }], ['du matin', 'in the morning', 'heure', { g: 'morning', ef: false }],
  ['du soir', 'in the evening', 'heure', { g: 'evening', ef: false }], ['en avance', 'early', 'heure', { g: 'early', ef: false }],
  ['en retard', 'late', 'heure', { g: 'late', ef: false }], ['midi', 'noon', 'heure'], ['minuit', 'midnight', 'heure'],
  ['pile', 'sharp, on the dot', 'heure'], ['presque', 'almost', 'heure'], ['tard', 'late', 'heure', { g: 'late', ef: false }],
  ['tôt', 'early', 'heure', { g: 'early', ef: false }], ['vers', 'about', 'heure'],
  ['avoir', 'to have', 'avoir'], ['avoir… ans', 'to be… years old', 'avoir'], ['avoir besoin (de)', 'to need', 'avoir'],
  ['avoir chaud', 'to be hot', 'avoir'], ['avoir froid', 'to be cold', 'avoir'], ['avoir soif', 'to be thirsty', 'avoir'],
  ['avoir sommeil', 'to be sleepy', 'avoir'], ['avoir faim', 'to be hungry', 'avoir'], ['avoir de la chance', 'to be lucky', 'avoir'],
  ['avoir envie (de)', 'to feel like', 'avoir'], ['avoir honte (de)', 'to be ashamed of', 'avoir'], ['avoir peur (de)', 'to be afraid of', 'avoir'],
  ['avoir l’air', 'to seem', 'avoir'], ['avoir raison', 'to be right', 'avoir'], ['avoir tort', 'to be wrong', 'avoir'],
  ['avoir de bonnes/mauvaises notes', 'to have good/bad grades', 'avoir']
].map(r => ({ fr: r[0], en: r[1], cat: r[2], g: (r[3] && r[3].g) || r[1], ef: !(r[3] && r[3].ef === false), id: slug(r[0]) }));

const CAT_NAME = { cours: 'school subjects', adj: 'adjectives', opinion: 'questions and opinions', verbe: 'verbs', temps: 'time expressions', heure: 'telling time', avoir: 'avoir expressions' };

function vocabQuestions() {
  const out = [], ids = new Set();
  V.forEach(p => { if (ids.has(p.id)) throw new Error('dup vocab id ' + p.id); ids.add(p.id); });
  function pool(p) {
    let a = V.filter(x => x !== p && x.cat === p.cat && x.g !== p.g);
    if (a.length < 8) a = a.concat(V.filter(x => x !== p && x.cat !== p.cat && x.g !== p.g));
    return shuffle(a);
  }
  V.forEach(p => {
    { // French -> English
      const seen = new Set([p.en]), ds = [];

const TEMPLATES = {
  cours: [], vocab: [], avoir: [avoirConjTemplate],
  heure: [() => timeD2F(), () => timeF2D(), () => timeD2F({ digits24: true }), () => timeF2D({ digits24: true })],
  er: [erTemplate], choix: [], listen: [listenTime, listenAvoir, listenVocab], challenge: []

const TPL_SHARE = { cours: 0, vocab: 0, avoir: 0.4, heure: 0.7, er: 0.6, choix: 0, listen: 1, challenge: 0 };

function play(q) { return Object.assign({}, q, { choices: shuffle(q.choices.map(x => Object.assign({}, x))) }); }
function genTemplateQ(topic) { return pick(TEMPLATES[topic])(); }

function makeRound(topicIds, n, used) {
  const ids = topicIds.slice(), quota = ids.map(() => Math.floor(n / ids.length));
  const extra = n - quota.reduce((a, b) => a + b, 0);
  for (let i = 0; i < extra; i++) quota[i % ids.length]++;
  const prompts = used || new Set(), picked = [];
  const take = q => { const key = q.prompt + '|' + (q.listen ? q.listen.speak : ''); if (prompts.has(key)) return false; prompts.add(key); picked.push(play(q)); return true; };
  ids.forEach((t, k) => {
    const fx = shuffle(FIXED[t]); let fi = 0, got = 0, guard = 0;
    while (got < quota[k] && guard++ < 800) {
      const wantTpl = TEMPLATES[t].length > 0 && (Math.random() < TPL_SHARE[t] || fi >= fx.length);
      if (wantTpl) { if (take(genTemplateQ(t))) got++; }
      else if (fi < fx.length) { if (take(fx[fi++])) got++; }
      else break;
    }
  });
  return shuffle(picked);
}

  const cards = shuffle2(dk.cards.filter(c => mode === 'review' ? K.has(c.id) : !K.has(c.id)));
  if (!cards.length) return;
  D = { dk, mode, queue: cards, pos: 0, next: [], flipped: false, pass: 1, aside: 0, back: 0, done: false, total: cards.length };
  state.screen = 'deck'; render(); window.scrollTo(0, 0);
}
function shuffle2(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function deck() {
  const K = knownSet(), review = D.mode === 'review';
  app.appendChild(h('div', { class: 'qhead' }, [h('span', { text: D.dk.name + (review ? ' (review)' : '') }), h('button', { class: 'btn ghost small', text: 'Back to decks', onclick: () => go('flash') })]));
  if (D.done) return deckSummary();
  const c = D.queue[D.pos], front = fdir() === 'fr' ? 'fr' : 'en';
  const frText = c.fr;
  const matches = D.dk.cards.filter(x => x.en === c.en);
  const backText = front === 'fr' ? c.en : matches.map(x => x.fr).join('  /  ');
  const extra = c.extra && (front === 'fr' || matches.length === 1) ? c.extra : '';
  const leftInDeck = D.dk.cards.filter(x => !K.has(x.id)).length;
  app.appendChild(h('div', { class: 'pile' }, [
    h('span', { text: (review ? 'Reviewing: ' : 'Pass ' + D.pass + ': ') + 'card ' + (D.pos + 1) + ' of ' + D.queue.length }),
    review ? null : h('span', { text: 'Still in the pile: ' + leftInDeck }),
    h('span', { text: 'Put aside: ' + (D.dk.cards.length - leftInDeck) })]));
  const face = D.flipped ? backText : (front === 'fr' ? frText : c.en);
  const sideLabel = D.flipped ? (front === 'fr' ? 'English' : 'French') : (front === 'fr' ? 'French' : 'English');
  const fc = h('button', { class: 'fcard' + (D.flipped ? ' back' : ''), 'aria-label': sideLabel + ': ' + face + '. Tap to flip.', onclick: () => { D.flipped = !D.flipped; render(); const b = app.querySelector('.fcard'); if (b) b.focus({ preventScroll: true }); } },
    [h('span', { class: 'side', text: sideLabel }), h('span', { text: face }), extra && D.flipped ? h('small', { text: extra }) : null, !D.flipped ? h('small', { text: 'Tap to flip' }) : null]);
  app.appendChild(fc);
  const speakText = (front === 'fr' && !D.flipped) || (front === 'en' && D.flipped) ? frText : null;
  if (canSpeak) app.appendChild(h('div', { class: 'listenbox', style: 'margin-top:10px' }, [h('button', { class: 'btn ghost small', text: '🔊 Hear the French', onclick: () => say(frText.replace(/\([^)]*\)/g, ''), false) }), h('span', { class: 'muted', text: '' }), dirToggle()]));
  else app.appendChild(h('div', { class: 'listenbox', style: 'margin-top:10px' }, [dirToggle()]));
  app.appendChild(h('div', { class: 'actions' }, [
    h('button', { class: 'btn learn big', text: review ? 'Needs more practice' : 'Still learning', onclick: () => answer(false) }),
    h('button', { class: 'btn know big', text: review ? 'Still know it' : 'I know it', onclick: () => answer(true) })]));
  app.appendChild(h('p', { class: 'muted', text: 'Tip: use the left and right arrow keys to sort cards.' }));
  fc.focus({ preventScroll: true });
}
function answer(knowIt) {
  if (!D || D.done) return;
  const c = D.queue[D.pos], K = knownSet();
  if (D.mode === 'learn') { if (knowIt) { K.add(c.id); D.aside++; saveKnown(); } else D.next.push(c); }
  else if (!knowIt) { K.delete(c.id); D.back++; saveKnown(); }
  D.pos++; D.flipped = false;
  if (D.pos >= D.queue.length) D.done = true;
  render();
}
document.addEventListener('keydown', e => {
  if (state.screen !== 'deck' || !D || D.done || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); answer(false); } else if (e.key === 'ArrowRight') { e.preventDefault(); answer(true); }
});
function deckSummary() {
  const review = D.mode === 'review', card = h('section', { class: 'card' });
  if (review) {
    card.appendChild(h('h3', { text: 'Review done' }));
    card.appendChild(h('p', { text: D.back ? D.back + ' card' + (D.back > 1 ? 's' : '') + ' went back into the pile. ' + (D.queue.length - D.back) + ' still put aside.' : 'You still know all ' + D.queue.length + '. Magnifique!' }));
    card.appendChild(h('div', { class: 'row' }, [D.back ? h('button', { class: 'btn', text: 'Study the pile', onclick: () => startDeck(D.dk.id, 'learn') }) : null, h('button', { class: 'btn ghost', text: 'Back to decks', onclick: () => go('flash') })]));
  } else if (!D.next.length) {
    card.appendChild(h('h3', { text: 'You know them all!' }));
    card.appendChild(h('div', { class: 'bubble' }, [h('span', { class: 'dog', 'aria-hidden': 'true', text: '🐶' }), h('div', { class: 'say', text: 'Pile empty! Zoomies! Come back for a quick review tomorrow.' })]));
    card.appendChild(h('div', { class: 'row' }, [h('button', { class: 'btn', text: 'Review the ones I put aside', onclick: () => startDeck(D.dk.id, 'review') }), h('button', { class: 'btn ghost', text: 'Take the practice quiz', onclick: () => go('quizstart') }), h('button', { class: 'btn ghost', text: 'Back to decks', onclick: () => go('flash') })]));
  } else {
    card.appendChild(h('h3', { text: 'Pass ' + D.pass + ' done' }));
    card.appendChild(h('p', { text: 'You put aside ' + D.aside + ' card' + (D.aside === 1 ? '' : 's') + ' this pass. ' + D.next.length + ' still in the pile.' }));
    card.appendChild(h('div', { class: 'row' }, [h('button', { class: 'btn', text: 'Go again with the ' + D.next.length + ' left', onclick: () => { D.queue = shuffle2(D.next); D.next = []; D.pos = 0; D.pass++; D.aside = 0; D.done = false; D.flipped = false; render(); window.scrollTo(0, 0); } }), h('button', { class: 'btn ghost', text: 'Back to decks', onclick: () => go('flash') })]));
  }
  app.appendChild(card);
}

/* ---------- boot ---------- */
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { const s = b.getAttribute('data-go'); if (s === 'notes') state.notesTab = state.notesTab || 'cours'; go(s); }));
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ } }
render();
})();

</script>
</body>
</html>
